<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Geschäftsidee Bewertung</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #10131a, #050608);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.9s ease-out;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #68d6ff, #9f6afd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      text-align: center;
      color: #d0d0d0;
      margin-bottom: 25px;
      font-size: 17px;
    }

    textarea {
      width: 100%;
      height: 180px;
      border-radius: 14px;
      padding: 18px;
      font-size: 16px;
      border: none;
      outline: none;
      resize: none;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.4);
      transition: 0.25s;
    }

    textarea:focus {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 12px #68d6ff;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, #68d6ff, #9f6afd);
      color: #050608;
      transition: 0.3s;
      box-shadow: 0 0 18px rgba(100, 100, 255, 0.3);
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(150, 150, 255, 0.6);
    }

    #result {
      margin-top: 28px;
      padding: 20px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
      font-size: 16px;
      color: #dff7ff;
      min-height: 40px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Score / Graph Styles --- */

    .score-box {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .total-score {
      background: radial-gradient(circle at top left, #68d6ff22, #00000055);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(104, 214, 255, 0.4);
    }

    .total-score-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a9dfff;
      margin-bottom: 4px;
    }

    .total-score-value {
      font-size: 32px;
      font-weight: 800;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .total-score-value span.small {
      font-size: 16px;
      font-weight: 400;
      color: #c4e9ff;
    }

    .bar {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-top: 10px;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #68d6ff, #9f6afd);
      box-shadow: 0 0 14px rgba(159, 106, 253, 0.8);
      transition: width 0.8s ease-out;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 20px;
    }

    .metric {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
    }

    .metric-label {
      color: #b9cbe0;
      margin-bottom: 4px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 600;
    }

    .summary-title {
      font-weight: 600;
      margin-top: 6px;
      margin-bottom: 4px;
      font-size: 15px;
      color: #cde7ff;
    }

    .summary-text {
      font-size: 14px;
      color: #e5f5ff;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px 18px;
      }
      h1 {
        font-size: 32px;
      }
      .metrics-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Geschäftsidee bewerten</h1>
    <p>Schreib deine Idee rein – die KI checkt Markt, Risiko & Potenzial.</p>

    <textarea id="idee" placeholder="Deine Geschäftsidee hier eingeben..."></textarea>
    <button onclick="bewerten()">Bewerten</button>

    <div id="result"></div>
  </div>

<script>
  function animateBars() {
    const bars = document.querySelectorAll(".bar-fill");
    bars.forEach(bar => {
      const target = bar.getAttribute("data-target");
      bar.style.width = target + "%";
    });
  }

  function attachMetricToggle() {
    const metrics = document.querySelectorAll(".metric");
    metrics.forEach(metric => {
      metric.addEventListener("click", () => {
        metric.classList.toggle("open");
      });
    });
  }

  async function bewerten() {
    const text = document.getElementById("idee").value;
    const resultBox = document.getElementById("result");

    if (!text.trim()) {
      resultBox.textContent = "Bitte zuerst eine Idee eingeben.";
      return;
    }

    resultBox.textContent = "⏳ Bewertung läuft…";

    try {
      const res = await fetch("https://hat-das-potenzial.onrender.com/bewerten", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });

      const data = await res.json();

      if (data.result) {
        const r = data.result;

        const totalMax = 40; // neue Gesamtskala: 4 Kriterien à 10 Punkte
        const totalPercent = Math.max(0, Math.min(100, (r.totalScore / totalMax) * 100));

        const marketPercent = Math.max(0, Math.min(100, (r.market / 10) * 100));
        const competitionPercent = Math.max(0, Math.min(100, (r.competition / 10) * 100));
        const scalabilityPercent = Math.max(0, Math.min(100, (r.scalability / 10) * 100));
        const capitalPercent = Math.max(0, Math.min(100, (r.capital / 10) * 100));

        resultBox.innerHTML = `
          <div class="score-box">
            <div class="total-score">
              <div class="total-score-label">Gesamt-Potenzial</div>
              <div class="total-score-value">
                ${r.totalScore}
                <span class="small">/ ${totalMax}</span>
              </div>
              <div class="bar">
                <div class="bar-fill" data-target="${totalPercent}"></div>
              </div>
            </div>

            <div class="metrics-grid">
              <div class="metric">
                <div class="metric-label">Marktgröße</div>
                <div class="metric-value">${r.market}/10</div>
                <div class="bar" style="margin-top:6px;">
                  <div class="bar-fill" data-target="${marketPercent}"></div>
                </div>
                <div class="metric-reason">
                  ${r.marketReason || "Begründung nicht verfügbar."}
                </div>
              </div>

              <div class="metric">
                <div class="metric-label">Konkurrenz</div>
                <div class="metric-value">${r.competition}/10</div>
                <div class="bar" style="margin-top:6px;">
                  <div class="bar-fill" data-target="${competitionPercent}"></div>
                </div>
                <div class="metric-reason">
                  ${r.competitionReason || "Begründung nicht verfügbar."}
                </div>
              </div>

              <div class="metric">
                <div class="metric-label">Skalierbarkeit</div>
                <div class="metric-value">${r.scalability}/10</div>
                <div class="bar" style="margin-top:6px;">
                  <div class="bar-fill" data-target="${scalabilityPercent}"></div>
                </div>
                <div class="metric-reason">
                  ${r.scalabilityReason || "Begründung nicht verfügbar."}
                </div>
              </div>

              <div class="metric">
                <div class="metric-label">Kapitalbedarf</div>
                <div class="metric-value">${r.capital}/10</div>
                <div class="bar" style="margin-top:6px;">
                  <div class="bar-fill" data-target="${capitalPercent}"></div>
                </div>
                <div class="metric-reason">
                  ${r.capitalReason || "Begründung nicht verfügbar."}
                </div>
              </div>
            </div>

            <div>
              <div class="summary-title">Fazit</div>
              <div class="summary-text">${r.summary}</div>
            </div>
          </div>
        `;

        // Balken animiert ansteigen lassen
        setTimeout(animateBars, 50);
        // Klick zum Aufklappen der Begründungen aktivieren
        attachMetricToggle();

      } else if (data.error) {
        resultBox.textContent = "❌ Fehler vom Server: " + data.error;
      } else {
        resultBox.textContent = JSON.stringify(data, null, 2);
      }

    } catch (e) {
      console.error(e);
      resultBox.textContent = "❌ Fehler: Backend nicht erreichbar.";
    }
  }
</script>

</body>
</html>
