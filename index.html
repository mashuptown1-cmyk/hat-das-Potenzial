<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Geschäftsidee Bewertung</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #10131a, #050608);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.9s ease-out;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #68d6ff, #9f6afd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      text-align: center;
      color: #d0d0d0;
      margin-bottom: 25px;
      font-size: 17px;
    }

    textarea {
      width: 100%;
      height: 180px;
      border-radius: 14px;
      padding: 18px;
      font-size: 16px;
      border: none;
      outline: none;
      resize: none;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.4);
      transition: 0.25s;
    }

    textarea:focus {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 12px #68d6ff;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, #68d6ff, #9f6afd);
      color: #050608;
      transition: 0.3s;
      box-shadow: 0 0 18px rgba(100, 100, 255, 0.3);
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(150, 150, 255, 0.6);
    }

    #result {
      margin-top: 28px;
      padding: 20px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
      white-space: pre-wrap;
      font-size: 16px;
      color: #dff7ff;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Geschäftsidee bewerten</h1>
    <p>Schreib deine Idee rein – der Algorithmus erledigt den Rest.</p>

    <textarea id="idee" placeholder="Deine Geschäftsidee hier eingeben..."></textarea>
    <button onclick="bewerten()">Bewerten</button>

    <div id="result"></div>
  </div>

  <script>
    async function bewerten() {
      const text = document.getElementById("idee").value;
      const resultBox = document.getElementById("result");

      resultBox.textContent = "⏳ Bewertung läuft…";

      try {
        const res = await fetch("https://DEINE-DOMAIN.DE/bewerten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        const data = await res.json();
        resultBox.textContent = data;

      } catch {
        resultBox.textContent = "❌ Fehler: Backend nicht erreichbar.";
      }
    }
  </script>
</body>
</html>
